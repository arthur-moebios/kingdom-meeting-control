name: Windows app

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/dashboard/**"
      - "packages/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          python -m pip install frida==17.24.3 pypdf==6.10.0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dashboard
      - run: npm run build:server
      - name: Assemble native Windows package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -OutputDirectory "$PWD/pkg" -PythonPath (Get-Command python).Source
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          if (Test-Path pkg/server.mjs) { throw 'Legacy web package must not be shipped.' }
          if (Test-Path pkg/data-native) { throw 'Runtime data must not be shipped.' }
      - name: Zip native package
        shell: pwsh
        run: Compress-Archive -Path pkg/* -DestinationPath KingdomMeetingControl-win.zip
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DSrcDir=$PWD/pkg" "/DOutDir=$PWD" "/DAppVersion=$env:APP_VERSION" scripts/win/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            KingdomMeetingControl-win.zip
            KingdomMeetingControl-setup.exe
          if-no-files-found: error
      - name: Update rolling release tag
        shell: pwsh
        run: |
          git tag --force pc-latest $env:GITHUB_SHA
          git push origin refs/tags/pc-latest --force
          if ($LASTEXITCODE -ne 0) { throw 'Release tag update failed.' }
      - name: Replace Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          target_commitish: ${{ github.sha }}
          name: Windows ${{ env.APP_VERSION }} — Zoom nativo
          make_latest: true
          body: |
            Versão ${{ env.APP_VERSION }}. Substitui o pacote antigo baseado no Chromium.

            Inclui painel Windows com Zoom desktop, JW Library, câmera, cronômetros
            PWA, Sala B, importação de nomes/programações e conector Cloudflare.
            Python e dependências acompanham o pacote.

            Instale KingdomMeetingControl-setup.exe ou extraia o ZIP portátil.
            Zoom desktop e JW Library devem estar instalados no computador.
            Nenhum banco de dados ou credencial pessoal é incluído.
          files: |
            KingdomMeetingControl-win.zip
            KingdomMeetingControl-setup.exe
