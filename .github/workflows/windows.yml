name: Windows app

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/dashboard/**"
      - "packages/**"
      - "scripts/build-server.mjs"
      - "scripts/win/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - run: npm run build:dashboard
      - run: npm run build:server

      - name: Download Chromium into the package
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\pkg\ms-playwright"
          npx playwright install chromium

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\server.mjs pkg\
          Copy-Item -Recurse apps\dashboard\dist pkg\public
          New-Item -ItemType Directory -Force pkg\node_modules | Out-Null
          Copy-Item -Recurse node_modules\playwright pkg\node_modules\playwright
          Copy-Item -Recurse node_modules\playwright-core pkg\node_modules\playwright-core
          Copy-Item (Get-Command node).Source pkg\node.exe
          Copy-Item scripts\win\install-autostart.ps1 pkg\
          Copy-Item scripts\win\share-picker.ps1 pkg\
          Copy-Item scripts\win\watch-jw-media.ps1 pkg\
          Copy-Item scripts\win\JwMediaObserver.cs pkg\
          Copy-Item scripts\win\JwMediaWindows.cs pkg\
          Copy-Item scripts\win\LEIA-ME.txt pkg\

          # WebView2 SDK (native window host). Download the NuGet package and
          # bundle its managed DLLs + the x64 native loader next to the exe.
          $wv2Ver = "1.0.2792.45"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$wv2Ver" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2 -Force
          Copy-Item wv2\lib\net462\Microsoft.Web.WebView2.Core.dll pkg\
          Copy-Item wv2\lib\net462\Microsoft.Web.WebView2.WinForms.dll pkg\
          Copy-Item wv2\runtimes\win-x64\native\WebView2Loader.dll pkg\

          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:x64 `
            /r:System.dll /r:System.Management.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:pkg\Microsoft.Web.WebView2.Core.dll /r:pkg\Microsoft.Web.WebView2.WinForms.dll `
            /out:pkg\KingdomMeetingControl.exe scripts\win\Launcher.cs
          Write-Host "Package contents:"; Get-ChildItem pkg

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path pkg\* -DestinationPath KingdomMeetingControl-win.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSrcDir=$PWD\pkg" "/DOutDir=$PWD" "/DAppVersion=0.1.0" scripts\win\installer.iss
          Get-ChildItem KingdomMeetingControl-setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            KingdomMeetingControl-win.zip
            KingdomMeetingControl-setup.exe
          if-no-files-found: error

      - name: Publish Release (public download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: Windows app (latest)
          body: "PC do Salão: INSTALADOR KingdomMeetingControl-setup.exe (recomendado — instala por usuário, cria atalhos) ou o pacote portátil .zip (extrair e rodar KingdomMeetingControl.exe). Inclui backend + painel + Chromium."
          files: |
            KingdomMeetingControl-win.zip
            KingdomMeetingControl-setup.exe
